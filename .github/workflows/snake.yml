name: Generate contribution snake

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "15 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#00C2A8&color_dots=#0B1220,#00C2A8,#00C2A8,#00C2A8,#00C2A8
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00C2A8&color_dots=#0B1220,#00C2A8,#00C2A8,#00C2A8,#00C2A8

      - name: Publish snake to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
