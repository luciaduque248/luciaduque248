<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="title desc">
  <title id="title">16-QAM Gray over AWGN</title>
  <desc id="desc">Project cover for the digital communications MATLAB project</desc>
  <style>
    :root{--bg:#FFF7FA;--text:#1F2937;--muted:#6B7280;--border:#FFD1E0;--chip:#FFE7EF}
    @media (prefers-color-scheme:dark){:root{--bg:#0D1117;--text:#F0F6FC;--muted:#8B949E;--border:#30363D;--chip:#221821}}
    .title{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--text)}
    .sub{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#FF6B9A}
    .stack{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--muted)}
    .tag{font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1.2px;fill:#A63A60}
  </style>
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF6B9A"/><stop offset="1" stop-color="#FFD166"/></linearGradient></defs>
  <rect x="1" y="1" width="718" height="218" rx="24" fill="var(--bg)" stroke="var(--border)" stroke-width="2"/>
  <circle cx="651" cy="49" r="80" fill="url(#g)" opacity=".13"/>
  <circle cx="688" cy="175" r="44" fill="#00C2A8" opacity=".11"/>
  <rect x="34" y="28" width="178" height="28" rx="14" fill="var(--chip)"/>
  <text x="123" y="47" text-anchor="middle" class="tag">DIGITAL COMMS · MATLAB</text>
  <text x="34" y="105" class="title">16-QAM Gray · AWGN</text>
  <text x="34" y="136" class="sub">Tx/Rx chain · BER · Signal visualization</text>
  <text x="34" y="177" class="stack">Gray mapping · AWGN · Matched filter · Eye diagram · Spectrum</text>
  <g fill="url(#g)">
    <circle cx="610" cy="104" r="5"/><circle cx="628" cy="104" r="5"/><circle cx="646" cy="104" r="5"/><circle cx="664" cy="104" r="5"/>
    <circle cx="610" cy="122" r="5"/><circle cx="628" cy="122" r="5"/><circle cx="646" cy="122" r="5"/><circle cx="664" cy="122" r="5"/>
    <circle cx="610" cy="140" r="5"/><circle cx="628" cy="140" r="5"/><circle cx="646" cy="140" r="5"/><circle cx="664" cy="140" r="5"/>
    <circle cx="610" cy="158" r="5"/><circle cx="628" cy="158" r="5"/><circle cx="646" cy="158" r="5"/><circle cx="664" cy="158" r="5"/>
  </g>
</svg>