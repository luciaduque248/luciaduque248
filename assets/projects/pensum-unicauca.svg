<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="title desc">
  <title id="title">Mi Pensum Interactivo</title>
  <desc id="desc">Project cover for Mi Pensum Interactivo</desc>
  <style>
    :root{--bg:#FFFBF0;--text:#1F2937;--muted:#6B7280;--border:#FFE8A3;--chip:#FFF2BF}
    @media (prefers-color-scheme:dark){:root{--bg:#0D1117;--text:#F0F6FC;--muted:#8B949E;--border:#30363D;--chip:#2A2412}}
    .title{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--text)}
    .sub{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#C88B00}
    .stack{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--muted)}
    .tag{font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1.2px;fill:#9B6B00}
  </style>
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFD166"/><stop offset="1" stop-color="#FF6B9A"/></linearGradient></defs>
  <rect x="1" y="1" width="718" height="218" rx="24" fill="var(--bg)" stroke="var(--border)" stroke-width="2"/>
  <circle cx="650" cy="48" r="80" fill="url(#g)" opacity=".13"/>
  <circle cx="686" cy="175" r="45" fill="#00C2A8" opacity=".11"/>
  <rect x="34" y="28" width="170" height="28" rx="14" fill="var(--chip)"/>
  <text x="119" y="47" text-anchor="middle" class="tag">ACADEMIC · WEB APP</text>
  <text x="34" y="105" class="title">Mi Pensum Interactivo</text>
  <text x="34" y="136" class="sub">Progress · Prerequisites · Voice</text>
  <text x="34" y="177" class="stack">React · TypeScript · Vite · Supabase · Alexa Skill</text>
  <path d="M608 103h55v55h-55z" fill="none" stroke="url(#g)" stroke-width="5" rx="8"/>
  <path d="M620 116h31M620 129h31M620 142h20" stroke="url(#g)" stroke-width="4" stroke-linecap="round"/>
