<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="title desc">
  <title id="title">Portfolio SRD</title>
  <desc id="desc">Project cover for Sara Duque's professional portfolio</desc>
  <style>
    :root{--bg:#FFF7FA;--text:#1F2937;--muted:#6B7280;--border:#FFD1E0;--chip:#FFE7EF}
    @media (prefers-color-scheme:dark){:root{--bg:#0D1117;--text:#F0F6FC;--muted:#8B949E;--border:#30363D;--chip:#221821}}
    .title{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--text)}
    .sub{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#FF6B9A}
    .stack{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--muted)}
    .tag{font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1.2px;fill:#A63A60}
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF6B9A"/><stop offset="1" stop-color="#00C2A8"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="718" height="218" rx="24" fill="var(--bg)" stroke="var(--border)" stroke-width="2"/>
  <circle cx="645" cy="45" r="78" fill="url(#g)" opacity=".13"/>
  <circle cx="684" cy="170" r="46" fill="#FFD166" opacity=".13"/>
  <rect x="34" y="28" width="132" height="28" rx="14" fill="var(--chip)"/>
  <text x="100" y="47" text-anchor="middle" class="tag">PORTFOLIO · WEB</text>
  <text x="34" y="105" class="title">Portfolio SRD</text>
  <text x="34" y="136" class="sub">Frontend · UX/UI · Product</text>
  <text x="34" y="177" class="stack">React 19 · Tailwind CSS · Radix UI · Vercel</text>
  <path d="M614 103h42v42h-42z" rx="10" fill="none" stroke="url(#g)" stroke-width="5"/>
  <path d="M625 127l9 9 18-21" fill="none" stroke="url(#g)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>