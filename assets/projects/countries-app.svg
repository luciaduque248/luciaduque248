<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="title desc">
  <title id="title">Country Explorer</title>
  <desc id="desc">Project cover for Country Explorer</desc>
  <style>
    :root{--bg:#F4FFFD;--text:#1F2937;--muted:#6B7280;--border:#B8F0E8;--chip:#DDF9F4}
    @media (prefers-color-scheme:dark){:root{--bg:#0D1117;--text:#F0F6FC;--muted:#8B949E;--border:#30363D;--chip:#102522}}
    .title{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--text)}
    .sub{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#00A891}
    .stack{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--muted)}
    .tag{font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1.2px;fill:#007E6D}
  </style>
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00C2A8"/><stop offset="1" stop-color="#FF6B9A"/></linearGradient></defs>
  <rect x="1" y="1" width="718" height="218" rx="24" fill="var(--bg)" stroke="var(--border)" stroke-width="2"/>
  <circle cx="652" cy="50" r="82" fill="url(#g)" opacity=".13"/>
  <circle cx="688" cy="176" r="44" fill="#FFD166" opacity=".12"/>
  <rect x="34" y="28" width="145" height="28" rx="14" fill="var(--chip)"/>
  <text x="106" y="47" text-anchor="middle" class="tag">NEXT.JS · API</text>
  <text x="34" y="105" class="title">Country Explorer</text>
  <text x="34" y="136" class="sub">Search · Filters · Dark mode</text>
  <text x="34" y="177" class="stack">React 19 · TypeScript · Tailwind · Jest · REST Countries</text>
  <circle cx="635" cy="124" r="29" fill="none" stroke="url(#g)" stroke-width="5"/>
  <path d="M606 124h58M635 95c10 10 15 19 15 29s-5 19-15 29M635 95c-10 10-15 19-15 29s5 19 15 29" fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round"/>
</svg>