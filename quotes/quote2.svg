<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" role="img" aria-labelledby="title desc">
  <title id="title">Testimonio de Oscar Caicedo</title>
  <desc id="desc">Comentario sobre trabajo en equipo y resolución creativa de problemas</desc>
  <style>
    :root{--bg:#F4FFFD;--text:#374151;--muted:#6B7280;--border:#B8F0E8;--accent:#00A891;--quote:#C7F3EC}
    @media (prefers-color-scheme:dark){:root{--bg:#161B22;--text:#F0F6FC;--muted:#8B949E;--border:#30363D;--accent:#39D7C2;--quote:#163A35}}
    .quote{font:700 62px Georgia,serif;fill:var(--quote)}
    .body{font:italic 500 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--text)}
    .name{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--accent)}
    .role{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--muted)}
  </style>
  <rect x="1" y="1" width="758" height="188" rx="22" fill="var(--bg)" stroke="var(--border)" stroke-width="2"/>
  <rect x="1" y="1" width="8" height="188" rx="4" fill="var(--accent)"/>
  <text x="34" y="62" class="quote">“</text>
  <text x="82" y="63" class="body">Destaca por su habilidad para trabajar en equipo y resolver problemas</text>
  <text x="82" y="93" class="body">de manera creativa.</text>
  <text x="82" y="137" class="name">Oscar Caicedo</text>
  <text x="82" y="161" class="role">IEEE</text>
</svg>